services:
  admin-api:
    build:
      context: ../SEOUL-WAVE_admin/backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:8000"
    environment:
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Add ADMIN_API_KEY to the SEOUL-WAVE root .env}
      CORS_ORIGINS: http://localhost:5175
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${POSTGRES_DB:-seoul_wave}
      DATABASE_USER: ${POSTGRES_USER:-seoul_wave_app}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the SEOUL-WAVE root .env}
      DATABASE_SSLMODE: disable
    depends_on:
      db:
        condition: service_healthy

  admin-frontend:
    build:
      context: ../SEOUL-WAVE_admin/frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5175:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8002
      VITE_DEMO_ADMIN_KEY: ${ADMIN_API_KEY:?Add ADMIN_API_KEY to the SEOUL-WAVE root .env}
    depends_on:
      - admin-api

  db-migrate-operations:
    image: postgres:18
    profiles:
      - db-migration
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-seoul_wave}
      PGUSER: ${POSTGRES_USER:-seoul_wave_app}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the SEOUL-WAVE root .env}
    volumes:
      - ./backend/migrations/003_operations_logging.sql:/migration.sql:ro
    command:
      - psql
      - --set=ON_ERROR_STOP=1
      - --file=/migration.sql
    depends_on:
      db:
        condition: service_healthy
