services:
  admin-api:
    image: ${ADMIN_API_IMAGE:?Set ADMIN_API_IMAGE to a verified SHA tag}
    restart: unless-stopped
    environment:
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Set ADMIN_API_KEY}
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${POSTGRES_DB:?Set POSTGRES_DB}
      DATABASE_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      DATABASE_SSLMODE: disable
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:?Set OPENAI_MODEL}
      SEOUL_CULTURE_API_KEY: ${SEOUL_CULTURE_API_KEY:?Set SEOUL_CULTURE_API_KEY}
      LANGGRAPH_HEALTH_URL: http://itinerary-worker:8090/health
    networks: [application, database]
    depends_on:
      db:
        condition: service_healthy
      itinerary-worker:
        condition: service_healthy
  admin-frontend:
    image: ${ADMIN_FRONTEND_IMAGE:?Set ADMIN_FRONTEND_IMAGE to a verified SHA tag}
    restart: unless-stopped
    environment:
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Set ADMIN_API_KEY}
    secrets:
      - admin_htpasswd
    ports:
      - "127.0.0.1:8081:80"
    networks: [application]
    depends_on:
      - admin-api
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
secrets:
  admin_htpasswd:
    file: ${ADMIN_HTPASSWD_FILE:?Set absolute path to an htpasswd file outside the repository}
