name: Admin CI
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build -- --base=/admin/
        working-directory: frontend
        env:
          VITE_API_BASE_URL: /admin
          VITE_DEMO_ADMIN_KEY: MUST_NOT_APPEAR_IN_PRODUCTION_BUNDLE
      - name: Ensure demo key was excluded from bundle
        run: |
          if grep -R -q MUST_NOT_APPEAR_IN_PRODUCTION_BUNDLE frontend/dist; then
            echo "::error::Demo administrator key was bundled"
            exit 1
          fi
